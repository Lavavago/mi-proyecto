name: CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Ejecutar Plan de Pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas unitarias y cobertura
        run: |
          pytest tests/unit/ -v --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Subir reporte de cobertura como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: Construir y Probar Dockerfile
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker
        run: |
          docker build -t mi-proyecto:${{ github.sha }} .

      - name: Probar ejecución del contenedor (Smoke Test)
        run: |
          docker run --rm mi-proyecto:${{ github.sha }}

  # ── ROL 3: DESPLIEGUE AL AMBIENTE DE RUNTIME ────────────────────────────────
  deploy:
    name: Desplegar en GHCR y Validar Runtime
    runs-on: ubuntu-latest
    needs: docker
    # Solo se despliega desde main y nunca desde un pull request
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    environment:
      name: production

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Construir y publicar imagen (docker push)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Desplegar contenedor desde el registry (runtime)
        run: |
          IMAGE="${{ env.REGISTRY }}/${IMAGE_NAME,,}:latest"
          docker pull "$IMAGE"
          docker run --rm --name mi-proyecto-runtime "$IMAGE" | tee runtime.log

      - name: Validar despliegue (verificación post-deploy)
        run: |
          grep -q "App lista: 5" runtime.log
          echo "Validación OK: el contenedor desplegado responde 'App lista: 5'"

      - name: Resumen del despliegue
        if: always()
        run: |
          {
            echo "## Resultado del despliegue"
            echo "- Estado: ${{ job.status }}"
            echo "- Rama: ${{ github.ref_name }}"
            echo "- Commit: ${GITHUB_SHA::7}"
            echo "- Imagen: ${{ env.REGISTRY }}/${IMAGE_NAME,,}"
            echo "- Digest: ${{ steps.push.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"